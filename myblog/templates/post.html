<div class="post-list">
    <span><a href="{% url 'post_view' post.post_slug %}">{{ post.post_title }}</a></span>
    <p>{{ post.body_preview|striptags }}</p>
    <span>
        {% for tag in post.tags.all %}
        <span style="font-weight: 500; text-decoration: underline;">{{ tag.name }}</span>
        {% empty %}
          <span style="font-weight: 600; color: darkred;">No tags</span>
        {% endfor %}
    </span>
</div>
