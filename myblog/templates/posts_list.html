{% extends "base.html" %}

{% block content %}
  <section class="posts-section">
    <div id="posts-feed" class="post-feed">
      {% for post in posts_list %}

          {% include "post.html" with post=post %}

        {% empty %}
        <span class="empty-posts">No posts found.</span>
      {% endfor %}
      {% if has_next %}
      <div
        hx-get="{% url 'sample_view' %}?page={{ next_page }}"
        hx-trigger="revealed"
        hx-swap="outerHTML"
        class="new-chunk-post"
      >
      <span>Loading more posts...</span>
    </div>
    {% endif %}
  </section>
{% endblock %}
