{% for post in posts_list %}
  {% include "post.html" with post=post %}
{% endfor %}

{% if has_next %}
  <div
    hx-get="{% if q %}{% url 'search_results' %}?q={{ q|urlencode }}&page={{ next_page }}{% elif tag %}{% url 'tag_results' tag=tag %}?page={{ next_page }}{% else %}{% url 'sample_view' %}?page={{ next_page }}{% endif %}"
    hx-trigger="revealed"
    hx-swap="outerHTML"
  >
    Loading more posts...
  </div>
{% endif %}
