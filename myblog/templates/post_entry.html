{% extends "base.html" %}

{% block title %}{{ post.post_title }}{% endblock %}

{% block content %}
  <section class="post-entry">
    <h2>{{ post.post_title }}</h2>
    <span>{{ post.body_html|safe }}</span>
    <p>tags:
        {%for tag in post.tags.all %}
          <span>{{ tag }}</span>
        {% endfor %}

    </p>
  </section>
{% endblock %}
